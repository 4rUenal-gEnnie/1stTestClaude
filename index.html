<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리마인더 앱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 24px;
      font-size: 28px;
    }

    .input-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: #4a6cf7;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #3955d3;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 6px 16px;
      border: 2px solid #e0e0e0;
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.2s;
    }

    .filter-btn.active {
      border-color: #4a6cf7;
      color: #4a6cf7;
      background: #eef1ff;
    }

    .reminder-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reminder-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: opacity 0.3s;
    }

    .reminder-card.completed {
      opacity: 0.5;
    }

    .reminder-card.completed .reminder-title {
      text-decoration: line-through;
    }

    .reminder-check {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }

    .reminder-check:hover {
      border-color: #4a6cf7;
    }

    .reminder-card.completed .reminder-check {
      background: #4a6cf7;
      border-color: #4a6cf7;
    }

    .reminder-body {
      flex: 1;
      min-width: 0;
    }

    .reminder-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .reminder-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .reminder-time {
      font-size: 12px;
      color: #4a6cf7;
      font-weight: 600;
    }

    .reminder-time.overdue {
      color: #e74c3c;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: #e74c3c;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reminder</h1>

    <div class="input-section">
      <div class="input-group">
        <label for="title">제목</label>
        <input type="text" id="title" placeholder="리마인더 제목을 입력하세요">
      </div>
      <div class="input-group">
        <label for="desc">메모 (선택)</label>
        <textarea id="desc" placeholder="상세 내용을 입력하세요"></textarea>
      </div>
      <div class="input-group">
        <label for="datetime">날짜 및 시간</label>
        <input type="datetime-local" id="datetime">
      </div>
      <button class="btn-add" onclick="addReminder()">추가</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active')">진행중</button>
      <button class="filter-btn" data-filter="completed" onclick="setFilter('completed')">완료</button>
    </div>

    <div class="reminder-list" id="reminderList"></div>
  </div>

  <script>
    let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
    let currentFilter = 'all';

    function save() {
      localStorage.setItem('reminders', JSON.stringify(reminders));
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      if (d.getFullYear() !== now.getFullYear()) {
        opts.year = 'numeric';
      }
      return d.toLocaleDateString('ko-KR', opts);
    }

    function isOverdue(iso) {
      return new Date(iso) < new Date();
    }

    function addReminder() {
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const datetime = document.getElementById('datetime').value;

      if (!title) {
        alert('제목을 입력해주세요.');
        return;
      }
      if (!datetime) {
        alert('날짜와 시간을 선택해주세요.');
        return;
      }

      reminders.push({
        id: Date.now(),
        title,
        desc,
        datetime,
        completed: false
      });

      save();
      render();

      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('datetime').value = '';

      scheduleNotification(reminders[reminders.length - 1]);
    }

    function toggleComplete(id) {
      const r = reminders.find(r => r.id === id);
      if (r) r.completed = !r.completed;
      save();
      render();
    }

    function deleteReminder(id) {
      reminders = reminders.filter(r => r.id !== id);
      save();
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function render() {
      const list = document.getElementById('reminderList');
      let filtered = reminders;

      if (currentFilter === 'active') {
        filtered = reminders.filter(r => !r.completed);
      } else if (currentFilter === 'completed') {
        filtered = reminders.filter(r => r.completed);
      }

      filtered.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">리마인더가 없습니다.</div>';
        return;
      }

      list.innerHTML = filtered.map(r => {
        const overdue = !r.completed && isOverdue(r.datetime);
        return `
          <div class="reminder-card ${r.completed ? 'completed' : ''}">
            <div class="reminder-check" onclick="toggleComplete(${r.id})"></div>
            <div class="reminder-body">
              <div class="reminder-title">${escapeHtml(r.title)}</div>
              ${r.desc ? `<div class="reminder-desc">${escapeHtml(r.desc)}</div>` : ''}
              <div class="reminder-time ${overdue ? 'overdue' : ''}">${overdue ? '지남: ' : ''}${formatDate(r.datetime)}</div>
            </div>
            <button class="btn-delete" onclick="deleteReminder(${r.id})">&times;</button>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scheduleNotification(reminder) {
      if (!('Notification' in window)) return;

      if (Notification.permission === 'default') {
        Notification.requestPermission();
      }

      const delay = new Date(reminder.datetime) - new Date();
      if (delay > 0) {
        setTimeout(() => {
          if (Notification.permission === 'granted') {
            new Notification('리마인더', { body: reminder.title });
          }
        }, delay);
      }
    }

    // Schedule notifications for existing reminders on load
    reminders.forEach(r => {
      if (!r.completed) scheduleNotification(r);
    });

    render();
  </script>
</body>
</html>
